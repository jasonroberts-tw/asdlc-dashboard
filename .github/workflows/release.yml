# Builds the desktop app for macOS, Linux and Windows and publishes the installers as a GitHub
# release named after the version in src-tauri/tauri.conf.json.
#
# Start it by pushing a tag v<version> (e.g. `git tag v0.2.0 && git push origin v0.2.0`), or by
# running the workflow from the Actions tab, which tags the chosen commit with v<version>.
#
# The release stays a draft until every platform has uploaded, so a failed build never leaves a
# published release with missing installers. Re-running the workflow reuses that draft.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: Create or reuse the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag="v$version"

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in src-tauri/tauri.conf.json"
              exit 1
            fi
          elif tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null) &&
            [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $tag already points at another commit; bump the version in src-tauri/tauri.conf.json"
            exit 1
          fi

          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "map(select(.tag_name == \"$tag\")) | first // empty | \"\(.id) \(.draft)\"")
          if [ -n "$existing" ]; then
            if [ "${existing#* }" != true ]; then
              echo "::error::Release $tag is already published; bump the version in src-tauri/tauri.conf.json"
              exit 1
            fi
            id=${existing% *}
            echo "Reusing draft release $tag ($id)"
          else
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="ASDLC Dashboard $tag" \
              -F draft=true -F generate_release_notes=true --jq .id)
            echo "Created draft release $tag ($id)"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal .dmg that runs on Apple Silicon and Intel Macs.
          - name: macOS
            runner: macos-latest
            args: --target universal-apple-darwin
          # .deb, .rpm and .AppImage. Built on the oldest supported Ubuntu so they run on
          # distributions with an older glibc.
          - name: Linux
            runner: ubuntu-22.04
            args: ''
          # NSIS setup .exe and .msi.
          - name: Windows
            runner: windows-latest
            args: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v6
        with:
          version: 12
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Ad-hoc signature: the app is not notarized, so macOS asks before the first launch, but
          # an ad-hoc signed app can be allowed in System Settings > Privacy & Security, where an
          # unsigned one is reported as damaged. Only read when bundling for macOS.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}
          uploadUpdaterJson: false

  publish-release:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --jq .html_url
